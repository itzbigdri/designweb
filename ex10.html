<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spoiler Alert (Show)</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="//unpkg.com/alpinejs" defer></script>
</head>
<body x-data="{hover: false}">
    <div  @mouseenter="hover = true" @mouseleave="hover = false" class="w-56 h-56 rounded-xl flex items-center justify-center bg-base-200"><span x-text="hover ? 'Entrou!' : 'Saiu!'"></span></div>
</body>
</html>
