<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Básico</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="//unpkg.com/alpinejs" defer></script>
</head>
<body>
    <div x-data="{modal: false}">
        <button class="btn btn-primary" @click="modal = true">Abrir modal</button>

        <div x-show="modal" class="w-full h-screen bg-zinc-900/50 flex justify-center items-center absolute left-0 top-0">
            <div class="card-body bg-white max-w-70 rounded-md">
                <h1 class="card-title">Seu modal foi aberto!</h1>
                <p>Clique no botão abaixo para fechar esse modal</p>
                <button class="card-actions btn btn-primary" @click="modal = false">Fechar modal</button>
            </div>
        </div>
    </div>
</body>
</html>
